<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>문의하기 - 농약마켓</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Segoe UI",sans-serif;background:#f4f6fb;}
    nav{background:#0f3460;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
    .logo{font-size:20px;font-weight:800;cursor:pointer;flex-shrink:0;white-space:nowrap;}
    .logo span{color:#e94560;}
    .nav-links{display:flex;gap:14px;flex-wrap:nowrap;}
    .nav-links a{color:#ccc;text-decoration:none;font-size:13px;white-space:nowrap;}
    .nav-links a:hover,.nav-links a.active{color:#fff;font-weight:700;}
    .nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .user-info{font-size:12px;color:#aaa;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .cart-btn{background:#e94560;border:none;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-weight:700;font-size:12px;}
    .logout-btn{background:transparent;border:1px solid #aaa;color:#aaa;padding:5px 10px;border-radius:20px;cursor:pointer;font-size:11px;}
    .logout-btn:hover{border-color:#fff;color:#fff;}
    .admin-btn{background:#f39c12;border:none;color:#fff;padding:5px 10px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:700;}
    @media(max-width:900px){.nav-links{gap:8px;}.nav-links a{font-size:11px;}}
    @media(max-width:700px){.nav-links{display:none;}}
    @media(max-width:480px){nav{padding:0 10px;}.user-info{display:none;}}
    .page-hero{background:linear-gradient(135deg,#4776e6,#8e54e9);color:#fff;padding:40px 20px;text-align:center;}
    .page-hero h2{font-size:28px;font-weight:800;margin-bottom:8px;}
    .wrap{max-width:700px;margin:28px auto;padding:0 16px;}
    .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;}
    .card h3{font-size:17px;font-weight:800;color:#0f3460;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f0f0f0;}
    .form-group{margin-bottom:14px;}
    label{display:block;margin-bottom:5px;font-size:13px;color:#555;font-weight:600;}
    input,textarea,select{width:100%;padding:10px 13px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;}
    input:focus,textarea:focus{border-color:#4776e6;}
    textarea{resize:none;height:100px;}
    .submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#4776e6,#8e54e9);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
    .msg{padding:9px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
    .msg.ok{background:#e8f5e9;color:#2e7d32;display:block;}
    .msg.err{background:#ffebee;color:#c62828;display:block;}
    /* 문의 목록 */
    .inq-item{border:1.5px solid #eee;border-radius:12px;padding:16px;margin-bottom:14px;}
    .inq-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
    .inq-title{font-weight:700;font-size:14px;color:#0f3460;}
    .inq-date{font-size:11px;color:#aaa;}
    .inq-content{font-size:13px;color:#555;line-height:1.6;margin-bottom:10px;}
    .inq-status{font-size:11px;padding:3px 10px;border-radius:10px;display:inline-block;font-weight:700;}
    .inq-status.pending{background:#fff8e1;color:#f57f17;}
    .inq-status.answered{background:#e8f5e9;color:#2e7d32;}
    .reply-box{background:#f0f4ff;border-radius:10px;padding:12px;margin-top:10px;}
    .reply-label{font-size:11px;font-weight:700;color:#4776e6;margin-bottom:5px;}
    .reply-text{font-size:13px;color:#333;line-height:1.6;}
    .empty{text-align:center;padding:40px;color:#aaa;}
    footer{background:#0f3460;color:#aaa;text-align:center;padding:18px;font-size:13px;margin-top:10px;}
  </style>
</head><body>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs,
             deleteDoc, onSnapshot, updateDoc, query, orderBy, where }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    const app = initializeApp({
      apiKey:"AIzaSyDSnirMbrHQNdqoN_pAEgpKoRDqKPUBdnU",
      authDomain:"shopmind-21828.firebaseapp.com",
      projectId:"shopmind-21828",
      storageBucket:"shopmind-21828.firebasestorage.app",
      messagingSenderId:"1038832915124",
      appId:"1:1038832915124:web:7f230b88de063b737b7de1"
    });
    window._auth  = getAuth(app);
    window._db    = getFirestore(app);
    window._authFn= { signOut, onAuthStateChanged };
    window._fsFn  = { doc, setDoc, getDoc, collection, addDoc, getDocs,
                      deleteDoc, onSnapshot, updateDoc, query, orderBy, where };
    window._fbReady=true;
    document.dispatchEvent(new Event("fbReady"));
  </script>
<nav>
  <div class="logo" id="goHome">농약<span>마켓</span></div>
  <div class="nav-links">
    <a href="new-products.html" id="navNew">신제품</a>
    <a href="best.html" id="navBest">베스트</a>
    <a href="product-info.html" id="navInfo">제품정보</a>
    <a href="inquiry.html" id="navInquiry">문의하기</a>
    <a href="notices.html" id="navNotice">공지사항</a>
    <a href="ai-inquiry.html" id="navAI">AI문의</a>
  </div>
  <div class="nav-right">
    <span class="user-info" id="userInfo"></span>
    <button class="admin-btn" id="adminBtn" style="display:none">관리자</button>
    <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>
</nav>
<div class="page-hero">
  <h2>💬 문의하기</h2>
  <p>궁금한 점을 남겨주시면 빠르게 답변해드릴게요!</p>
</div>
<div class="wrap">
  <div class="card">
    <h3>✏️ 문의 작성</h3>
    <div id="formMsg" class="msg"></div>
    <div class="form-group"><label>제목</label><input id="inqTitle" placeholder="문의 제목을 입력해주세요"/></div>
    <div class="form-group"><label>문의 내용</label><textarea id="inqContent" placeholder="궁금한 점을 자세히 적어주세요."></textarea></div>
    <button class="submit-btn" id="submitBtn">문의 등록하기</button>
  </div>
  <div class="card">
    <h3>📋 내 문의 내역</h3>
    <div id="inqList"><div class="empty">⏳ 로딩 중...</div></div>
  </div>
</div>
<footer>© 2025 농약마켓. All rights reserved.</footer>
<script>

  var currentUser = null, isAdmin = false, cart = [];
  function waitFB(fn){if(window._fbReady)fn();else document.addEventListener("fbReady",fn,{once:true});}
  function fs(){return window._fsFn;}
  function db(){return window._db;}

  document.getElementById("goHome").addEventListener("click",function(){location.href="index.html";});
  document.getElementById("logoutBtn").addEventListener("click",doLogout);
  document.getElementById("cartBtn").addEventListener("click",function(){location.href="index.html";});
  var _ab=document.getElementById("adminBtn");
  if(_ab) _ab.addEventListener("click",function(){location.href="admin.html";});

  function doLogout(){window._authFn.signOut(window._auth).then(function(){sessionStorage.clear();location.href="login.html";});}
  function updateCartCount(){var el=document.getElementById("cartCount");if(el)el.textContent=cart.reduce(function(s,i){return s+i.qty;},0);}

  waitFB(function(){
    window._authFn.onAuthStateChanged(window._auth,async function(user){
      if(!user){location.href="login.html";return;}
      currentUser=user;
      var snap=await fs().getDoc(fs().doc(db(),"users",user.uid));
      var data=snap.data()||{};
      document.getElementById("userInfo").textContent=(data.name||user.email.split("@")[0])+"님";
      isAdmin=data.role==="admin";
      if(isAdmin&&document.getElementById("adminBtn"))document.getElementById("adminBtn").style.display="block";
      cart=JSON.parse(sessionStorage.getItem("cart_"+user.uid)||"[]");
      updateCartCount();
      if(typeof onAuthReady==="function")onAuthReady(user,data);
    });
  });
  document.getElementById("submitBtn").addEventListener("click",submitInquiry);

  function onAuthReady(user){
    // 내 문의 실시간
    fs().onSnapshot(
      fs().query(fs().collection(db(),"inquiries"),fs().where("uid","==",user.uid),fs().orderBy("createdAt","desc")),
      function(snap){
        var el=document.getElementById("inqList");
        if(snap.empty){el.innerHTML='<div class="empty">📭 아직 문의 내역이 없어요.<br/>위에서 첫 문의를 남겨보세요!</div>';return;}
        var html="";
        snap.docs.forEach(function(d){
          var q=d.data();
          var dateStr=q.createdAt?new Date(q.createdAt).toLocaleString("ko-KR"):"-";
          var replyHtml=q.reply?'<div class="reply-box"><div class="reply-label">💬 관리자 답변</div><div class="reply-text">'+q.reply+'</div></div>':"";
          html+='<div class="inq-item">'
            +'<div class="inq-header"><div class="inq-title">'+q.title+'</div><div class="inq-date">'+dateStr+'</div></div>'
            +'<div class="inq-content">'+q.content+'</div>'
            +'<span class="inq-status '+(q.status==="answered"?"answered":"pending")+'">'+(q.status==="answered"?"✅ 답변완료":"⏳ 답변대기")+'</span>'
            +replyHtml
            +'</div>';
        });
        el.innerHTML=html;
      }
    );
  }

  function submitInquiry(){
    var title=document.getElementById("inqTitle").value.trim();
    var content=document.getElementById("inqContent").value.trim();
    var msg=document.getElementById("formMsg");
    if(!title||!content){msg.textContent="❌ 제목과 내용을 모두 입력해주세요.";msg.className="msg err";return;}
    document.getElementById("submitBtn").disabled=true;
    fs().addDoc(fs().collection(db(),"inquiries"),{
      uid:currentUser.uid, email:currentUser.email,
      title:title, content:content,
      status:"pending", reply:"", replyAt:"",
      createdAt:new Date().toISOString()
    }).then(function(){
      msg.textContent="✅ 문의가 등록되었습니다! 빠르게 답변해드릴게요.";msg.className="msg ok";
      document.getElementById("inqTitle").value="";
      document.getElementById("inqContent").value="";
      document.getElementById("submitBtn").disabled=false;
      setTimeout(function(){msg.className="msg";},4000);
    }).catch(function(e){msg.textContent="❌ 오류: "+e.message;msg.className="msg err";document.getElementById("submitBtn").disabled=false;});
  }
</script></body></html>
