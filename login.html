<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 - ShopMind</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .box{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
    .logo{text-align:center;margin-bottom:28px;}
    .logo h1{font-size:28px;color:#0f3460;}.logo span{color:#e94560;}
    .tabs{display:flex;border-radius:10px;overflow:hidden;border:1px solid #ddd;margin-bottom:24px;}
    .tabs button{flex:1;padding:11px;border:none;background:#f5f5f5;cursor:pointer;font-size:14px;font-weight:600;}
    .tabs button.active{background:#0f3460;color:#fff;}
    .form-group{margin-bottom:14px;}
    label{display:block;margin-bottom:5px;font-size:13px;color:#555;font-weight:600;}
    input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;}
    input:focus{border-color:#0f3460;}
    .pw-wrap{position:relative;}
    .pw-wrap input{padding-right:44px;}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:#aaa;}
    .pw-strength{margin-top:5px;height:4px;border-radius:4px;background:#eee;}
    .pw-strength-bar{height:100%;width:0;transition:.3s;border-radius:4px;}
    .pw-hint{font-size:11px;color:#aaa;margin-top:3px;}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .msg{margin-top:10px;text-align:center;font-size:13px;padding:8px;border-radius:8px;}
    .msg.ok{background:#e8f5e9;color:#2e7d32;}
    .msg.err{background:#ffebee;color:#c62828;}
    .badge{display:flex;align-items:center;gap:6px;font-size:11px;color:#aaa;justify-content:center;margin-top:14px;}
    .hidden{display:none;}
  </style>
</head>
<body>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const app  = initializeApp({
      apiKey: "AIzaSyDSnirMbrHQNdqoN_pAEgpKoRDqKPUBdnU",
      authDomain: "shopmind-21828.firebaseapp.com",
      projectId: "shopmind-21828",
      storageBucket: "shopmind-21828.firebasestorage.app",
      messagingSenderId: "1038832915124",
      appId: "1:1038832915124:web:7f230b88de063b737b7de1"
    });
    window._auth    = getAuth(app);
    window._db      = getFirestore(app);
    window._storage = getStorage(app);
    window._authFn  = { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    window._fsFn    = { doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, onSnapshot };
    window._stFn    = { ref, uploadBytes, getDownloadURL, deleteObject };
    window._fbReady = true;
    document.dispatchEvent(new Event('fbReady'));
  </script>
<div class="box">
  <div class="logo"><h1>Shop<span>Mind</span></h1><p style="font-size:13px;color:#999;margin-top:3px;">스마트한 쇼핑의 시작</p></div>
  <div class="tabs">
    <button class="active" onclick="switchTab('login')">로그인</button>
    <button onclick="switchTab('signup')">회원가입</button>
  </div>
  <div id="loginForm">
    <div class="form-group"><label>이메일</label><input id="lemail" type="email" placeholder="이메일 주소"/></div>
    <div class="form-group"><label>비밀번호</label>
      <div class="pw-wrap"><input id="lpw" type="password" placeholder="비밀번호"/>
      <button class="pw-toggle" onclick="togglePw('lpw',this)">👁</button></div>
    </div>
    <button class="btn" id="loginBtn" onclick="login()">로그인</button>
  </div>
  <div id="signupForm" class="hidden">
    <div class="form-group"><label>이름</label><input id="sname" placeholder="이름"/></div>
    <div class="form-group"><label>이메일</label><input id="semail" type="email" placeholder="이메일"/></div>
    <div class="form-group"><label>비밀번호</label>
      <div class="pw-wrap"><input id="spw" type="password" placeholder="8자 이상, 영문+숫자" oninput="checkStrength(this.value)"/>
      <button class="pw-toggle" onclick="togglePw('spw',this)">👁</button></div>
      <div class="pw-strength"><div class="pw-strength-bar" id="strengthBar"></div></div>
      <div class="pw-hint" id="strengthHint">비밀번호를 입력해주세요</div>
    </div>
    <div class="form-group"><label>비밀번호 확인</label>
      <div class="pw-wrap"><input id="spw2" type="password" placeholder="비밀번호 재입력"/>
      <button class="pw-toggle" onclick="togglePw('spw2',this)">👁</button></div>
    </div>
    <div class="form-group" style="display:flex;align-items:flex-start;gap:8px;">
      <input type="checkbox" id="agree" style="width:auto;margin-top:3px;"/>
      <label for="agree" style="font-size:12px;cursor:pointer;"><a href="#" style="color:#0f3460;">[필수] 개인정보처리방침</a> 및 <a href="#" style="color:#0f3460;">[필수] 이용약관</a>에 동의합니다.</label>
    </div>
    <button class="btn" id="signupBtn" onclick="signup()">회원가입</button>
  </div>
  <div id="msg"></div>
  <div class="badge">🔒 Firebase Authentication 보호</div>
</div>
<script>
  function waitFB(fn){if(window._fbReady)fn();else document.addEventListener('fbReady',fn,{once:true});}
  function switchTab(t){
    document.getElementById('loginForm').classList.toggle('hidden',t!=='login');
    document.getElementById('signupForm').classList.toggle('hidden',t!=='signup');
    document.querySelectorAll('.tabs button')[0].classList.toggle('active',t==='login');
    document.querySelectorAll('.tabs button')[1].classList.toggle('active',t==='signup');
    showMsg('','');
  }
  function showMsg(txt,type){const el=document.getElementById('msg');el.textContent=txt;el.className='msg '+(txt?type:'');}
  function togglePw(id,btn){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';btn.textContent=el.type==='password'?'👁':'🙈';}
  function checkStrength(pw){
    const bar=document.getElementById('strengthBar'),hint=document.getElementById('strengthHint');
    let s=0;if(pw.length>=8)s++;if(/[A-Za-z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;
    bar.style.width=(s*25)+'%';bar.style.background=['#ccc','#e94560','#f39c12','#27ae60','#0f3460'][s];
    hint.textContent=pw?['','취약🔴','보통🟡','강함🟢','매우강함💪'][s]:'비밀번호를 입력해주세요';
  }
  async function signup(){
    const name=document.getElementById('sname').value.trim(),email=document.getElementById('semail').value.trim(),pw=document.getElementById('spw').value,pw2=document.getElementById('spw2').value,agree=document.getElementById('agree').checked;
    if(!name||!email||!pw||!pw2)return showMsg('모든 항목을 입력해주세요.','err');
    if(pw.length<8||!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw))return showMsg('비밀번호는 8자 이상 영문+숫자 포함이어야 합니다.','err');
    if(pw!==pw2)return showMsg('비밀번호가 일치하지 않습니다.','err');
    if(!agree)return showMsg('약관에 동의해주세요.','err');
    const btn=document.getElementById('signupBtn');btn.disabled=true;btn.textContent='처리 중...';
    waitFB(async()=>{
      try{
        const cred=await window._authFn.createUserWithEmailAndPassword(window._auth,email,pw);
        await window._fsFn.setDoc(window._fsFn.doc(window._db,'users',cred.user.uid),{name,email,role:email==='admin@shopmind.com'?'admin':'user',createdAt:new Date().toISOString()});
        showMsg('✅ 회원가입 완료!','ok');switchTab('login');
      }catch(e){
        const m={'auth/email-already-in-use':'이미 사용 중인 이메일입니다.','auth/invalid-email':'이메일 형식이 올바르지 않습니다.'};
        showMsg(m[e.code]||e.message,'err');
      }finally{btn.disabled=false;btn.textContent='회원가입';}
    });
  }
  async function login(){
    const email=document.getElementById('lemail').value.trim(),pw=document.getElementById('lpw').value;
    if(!email||!pw)return showMsg('이메일과 비밀번호를 입력해주세요.','err');
    const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='로그인 중...';
    waitFB(async()=>{
      try{await window._authFn.signInWithEmailAndPassword(window._auth,email,pw);location.href='index.html';}
      catch(e){
        const m={'auth/invalid-credential':'이메일 또는 비밀번호가 틀렸습니다.','auth/too-many-requests':'잠시 후 다시 시도해주세요.'};
        showMsg(m[e.code]||e.message,'err');btn.disabled=false;btn.textContent='로그인';
      }
    });
  }
  waitFB(()=>{window._authFn.onAuthStateChanged(window._auth,u=>{if(u)location.href='index.html';});});
</script>
</body></html>
