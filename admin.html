<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 - ShopMind</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Segoe UI",sans-serif;background:#f4f6fb;}
    nav{background:#0f3460;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;}
    .logo{font-size:22px;font-weight:800;cursor:pointer;}.logo span{color:#e94560;}
    .nav-right{display:flex;gap:8px;}
    .back-btn{background:transparent;border:1px solid #aaa;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;}
    .back-btn:hover{border-color:#fff;color:#fff;}
    .wrap{max-width:1000px;margin:24px auto;padding:0 16px;}
    .tab-nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
    .tab-nav button{padding:9px 16px;border:2px solid #ddd;border-radius:25px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;}
    .tab-nav button.active{background:#0f3460;color:#fff;border-color:#0f3460;}
    @media(max-width:480px){.tab-nav button{padding:7px 11px;font-size:12px;}}
    .tab-content{display:none;}.tab-content.show{display:block;}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
    .stat-card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.07);}
    .stat-icon{font-size:28px;margin-bottom:6px;}
    .stat-val{font-size:22px;font-weight:800;color:#0f3460;}
    .stat-label{font-size:11px;color:#888;margin-top:3px;}
    .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin-bottom:20px;}
    .card h3{font-size:16px;font-weight:800;color:#0f3460;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f0f0f0;}
    table{width:100%;border-collapse:collapse;display:block;overflow-x:auto;}
    th{background:#f0f4ff;padding:10px 12px;text-align:left;font-size:12px;color:#555;font-weight:700;white-space:nowrap;}
    td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;vertical-align:middle;}
    .del-btn{background:#ffebee;color:#c62828;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;}
    .del-btn:hover{background:#c62828;color:#fff;}
    .prod-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:600px){.prod-form{grid-template-columns:1fr;}}
    .prod-form .full{grid-column:1/-1;}
    .prod-form input,.prod-form select,.prod-form textarea{width:100%;padding:10px 13px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;}
    .prod-form input:focus,.prod-form select:focus{border-color:#0f3460;}
    .prod-form textarea{resize:none;height:68px;}
    .submit-btn{grid-column:1/-1;padding:12px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
    .img-upload-area{border:2px dashed #ddd;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden;}
    .img-upload-area:hover{border-color:#0f3460;background:#f8f9ff;}
    .img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .img-preview{width:100%;height:130px;object-fit:cover;border-radius:10px;margin-top:8px;display:none;}
    .preview-box{background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:14px;display:none;align-items:center;gap:14px;}
    .preview-box.show{display:flex;}
    .preview-thumb{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
    .preview-thumb img{width:100%;height:100%;object-fit:cover;}
    .msg{padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
    .msg.ok{background:#e8f5e9;color:#2e7d32;display:block;}
    .msg.err{background:#ffebee;color:#c62828;display:block;}
    .cat-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:36px;}
    .cat-tag{display:flex;align-items:center;gap:5px;background:#e8f4fd;color:#0f3460;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;}
    .cat-tag button{background:none;border:none;color:#e94560;cursor:pointer;font-size:15px;line-height:1;padding:0;}
    .cat-add-row{display:flex;gap:8px;}
    .cat-add-row input{flex:1;padding:9px 13px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;}
    .cat-add-row input:focus{border-color:#0f3460;}
    .cat-add-row button{padding:9px 16px;background:#0f3460;color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;}
    .notice-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;}
    .no-data{text-align:center;padding:24px;color:#aaa;font-size:14px;}
    .prod-thumb{width:36px;height:36px;border-radius:6px;overflow:hidden;background:#f0f0f0;display:inline-flex;align-items:center;justify-content:center;font-size:20px;}
    .prod-thumb img{width:100%;height:100%;object-fit:cover;}
    .progress-wrap{width:100%;height:6px;background:#eee;border-radius:3px;margin-top:8px;display:none;}
    .progress-bar{height:100%;background:linear-gradient(135deg,#0f3460,#e94560);border-radius:3px;width:0;transition:width .3s;}
  </style>
</head>
<body>

<nav>
  <div class="logo" onclick="location.href='index.html'">Shop<span>Mind</span> <span style="font-size:12px;color:#f39c12;">관리자</span></div>
  <div class="nav-right">
    <button class="back-btn" onclick="location.href='index.html'">← 스토어로</button>
  </div>
</nav>

<div class="wrap">
  <div class="tab-nav" id="tabNav">
    <button class="active" data-tab="dashboard">📊 대시보드</button>
    <button data-tab="products">📦 상품관리</button>
    <button data-tab="categories">🏷️ 카테고리</button>
    <button data-tab="orders">🧾 주문내역</button>
    <button data-tab="users">👥 회원관리</button>
    <button data-tab="notice">📢 공지사항</button>
  </div>

  <!-- 대시보드 -->
  <div class="tab-content show" id="tab-dashboard">
    <div class="stats">
      <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val" id="statProds">-</div><div class="stat-label">등록 상품수</div></div>
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val" id="statUsers">-</div><div class="stat-label">총 회원수</div></div>
      <div class="stat-card"><div class="stat-icon">🧾</div><div class="stat-val" id="statOrders">-</div><div class="stat-label">총 주문수</div></div>
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val" id="statSales">-</div><div class="stat-label">총 매출(원)</div></div>
    </div>
  </div>

  <!-- 상품 관리 -->
  <div class="tab-content" id="tab-products">
    <div class="card">
      <h3>➕ 상품 추가</h3>
      <div id="prodMsg" class="msg"></div>
      <div class="preview-box" id="previewBox">
        <div class="preview-thumb" id="pvThumb">🛍️</div>
        <div>
          <div style="font-size:11px;background:#e8f4fd;color:#0f3460;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:3px;" id="pvCat">카테고리</div>
          <div style="font-size:15px;font-weight:700;color:#0f3460;" id="pvName">상품명</div>
          <div style="font-size:14px;color:#e94560;font-weight:700;" id="pvPrice">₩0</div>
        </div>
      </div>
      <div class="prod-form">
        <div>
          <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px;">상품명 *</label>
          <input id="pName" placeholder="예: 무선 이어폰"/>
        </div>
        <div>
          <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px;">가격 (원) *</label>
          <input id="pPrice" type="number" placeholder="예: 59000"/>
        </div>
        <div>
          <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px;">카테고리 *</label>
          <select id="pCat"><option value="">선택</option></select>
        </div>
        <div></div>
        <div>
          <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px;">이모지 (상품 아이콘) *</label>
          <input id="pEmoji" placeholder="예: 🎧 👟 💻" maxlength="4" style="font-size:22px;"/>
        </div>
        <div class="full">
          <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px;">상품 설명 *</label>
          <textarea id="pDesc" placeholder="상품 설명을 입력하세요."></textarea>
        </div>
        <button class="submit-btn" id="submitProdBtn">✅ 상품 등록하기</button>
      </div>
    </div>
    <div class="card">
      <h3>📋 등록된 상품 목록</h3>
      <div id="productTable"><div class="no-data">로딩 중...</div></div>
    </div>
  </div>

  <!-- 카테고리 -->
  <div class="tab-content" id="tab-categories">
    <div class="card">
      <h3>🏷️ 카테고리 관리</h3>
      <p style="font-size:13px;color:#888;margin-bottom:14px;">추가한 카테고리는 상품 등록 시 선택 가능하고 스토어 필터에 실시간 반영됩니다.</p>
      <div class="cat-list" id="catList"><div class="no-data">로딩 중...</div></div>
      <div class="cat-add-row">
        <input id="newCatName" placeholder="새 카테고리 이름 (예: 스포츠)"/>
        <button id="addCatBtn">추가</button>
      </div>
    </div>
  </div>

  <!-- 주문 내역 -->
  <div class="tab-content" id="tab-orders">
    <div class="card"><h3>🧾 전체 주문 내역</h3><div id="orderTable"><div class="no-data">로딩 중...</div></div></div>
  </div>

  <!-- 회원 관리 -->
  <div class="tab-content" id="tab-users">
    <div class="card"><h3>👥 회원 목록</h3><div id="userTable"><div class="no-data">로딩 중...</div></div></div>
  </div>

  <!-- 공지사항 -->
  <div class="tab-content" id="tab-notice">
    <div class="card">
      <h3>📢 공지사항 관리</h3>
      <div id="noticeList"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <input id="noticeInput" placeholder="공지 내용 입력" style="flex:1;padding:10px 13px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;"/>
        <button id="addNoticeBtn" style="padding:10px 18px;background:#0f3460;color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;">등록</button>
      </div>
    </div>

<script>
// ── 유틸 ──────────────────────────────────────────────────────────────────────
function waitFB(fn) {
  if (window._fbReady) fn();
  else document.addEventListener("fbReady", fn, {once:true});
}
function getDB() { return window._db; }
function getFS() { return window._fsFn; }

// ── 탭 전환 (addEventListener 방식) ──────────────────────────────────────────
var TABS = ["dashboard","products","categories","orders","users","notice"];
document.getElementById("tabNav").querySelectorAll("button").forEach(function(btn) {
  btn.addEventListener("click", function() {
    var t = btn.dataset.tab;
    document.querySelectorAll(".tab-nav button").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
    document.querySelectorAll(".tab-content").forEach(function(c){c.classList.remove("show");});
    document.getElementById("tab-" + t).classList.add("show");
    if (t === "dashboard")  loadStats();
    if (t === "products")   { loadProducts(); loadCatOptions(); }
    if (t === "categories") loadCategories();
    if (t === "orders")     loadOrders();
    if (t === "users")      loadUsers();
    if (t === "notice")     loadNotices();
  });
});

// ── 인증 확인 ─────────────────────────────────────────────────────────────────
waitFB(function() {
  window._authFn.onAuthStateChanged(window._auth, async function(user) {
    if (!user) { location.href = "login.html"; return; }
    var snap = await getFS().getDoc(getFS().doc(getDB(), "users", user.uid));
    if (!snap.exists() || snap.data().role !== "admin") {
      alert("관리자만 접근 가능합니다.");
      location.href = "index.html";
      return;
    }
    loadStats();
    loadCatOptions();
  });
});

// ── 대시보드 통계 ─────────────────────────────────────────────────────────────
function loadStats() {
  waitFB(async function() {
    var fs = getFS(), db = getDB();
    var results = await Promise.all([
      fs.getDocs(fs.collection(db,"products")),
      fs.getDocs(fs.collection(db,"users")),
      fs.getDocs(fs.collection(db,"orders"))
    ]);
    document.getElementById("statProds").textContent  = results[0].size;
    document.getElementById("statUsers").textContent  = results[1].size;
    document.getElementById("statOrders").textContent = results[2].size;
    var sales = results[2].docs.reduce(function(s,d){return s+(d.data().total||0);},0);
    document.getElementById("statSales").textContent  = sales.toLocaleString();
  });
}

// ── 카테고리 옵션 (상품 폼용) ─────────────────────────────────────────────────
function loadCatOptions() {
  waitFB(async function() {
    var snap = await getFS().getDocs(getFS().collection(getDB(),"categories"));
    var sel  = document.getElementById("pCat");
    var cur  = sel.value;
    sel.innerHTML = '<option value="">선택</option>';
    snap.docs.forEach(function(d) {
      var o = document.createElement("option");
      o.value = o.textContent = d.data().name;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
  });
}

// ── 카테고리 관리 ─────────────────────────────────────────────────────────────
function loadCategories() {
  waitFB(async function() {
    var snap = await getFS().getDocs(getFS().collection(getDB(),"categories"));
    var el   = document.getElementById("catList");
    if (snap.empty) { el.innerHTML = '<div class="no-data">등록된 카테고리가 없습니다.</div>'; return; }
    el.innerHTML = "";
    snap.docs.forEach(function(d) {
      var tag = document.createElement("div");
      tag.className = "cat-tag";
      var span = document.createElement("span");
      span.textContent = d.data().name;
      var btn = document.createElement("button");
      btn.textContent = "✕";
      btn.title = "삭제";
      btn.addEventListener("click", function() { delCategory(d.id); });
      tag.appendChild(span);
      tag.appendChild(btn);
      el.appendChild(tag);
    });
  });
}

document.getElementById("addCatBtn").addEventListener("click", function() {
  var name = document.getElementById("newCatName").value.trim();
  if (!name) { alert("카테고리 이름을 입력해주세요."); return; }
  waitFB(async function() {
    var fs = getFS(), db = getDB();
    var snap = await fs.getDocs(fs.collection(db,"categories"));
    if (snap.docs.some(function(d){return d.data().name===name;})) {
      alert("이미 존재하는 카테고리입니다."); return;
    }
    await fs.addDoc(fs.collection(db,"categories"),{name:name,createdAt:new Date().toISOString()});
    document.getElementById("newCatName").value = "";
    loadCategories(); loadCatOptions();
  });
});

document.getElementById("newCatName").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("addCatBtn").click();
});

function delCategory(id) {
  if (!confirm("이 카테고리를 삭제하시겠습니까?")) return;
  waitFB(async function() {
    await getFS().deleteDoc(getFS().doc(getDB(),"categories",id));
    loadCategories(); loadCatOptions();
  });
}

// ── 이미지 미리보기 ───────────────────────────────────────────────────────────
// 입력할 때마다 미리보기 업데이트
["pName","pPrice","pCat","pEmoji"].forEach(function(id) {
  document.getElementById(id).addEventListener("input", function() {
    document.getElementById("pvName").textContent  = document.getElementById("pName").value || "상품명";
    document.getElementById("pvPrice").textContent = "₩" + (parseInt(document.getElementById("pPrice").value)||0).toLocaleString();
    document.getElementById("pvCat").textContent   = document.getElementById("pCat").value || "카테고리";
    document.getElementById("pvThumb").textContent = document.getElementById("pEmoji").value || "🛍️";
    document.getElementById("previewBox").classList.add("show");
  });
});

// ── 상품 등록 ─────────────────────────────────────────────────────────────────
document.getElementById("submitProdBtn").addEventListener("click", function() {
  var name  = document.getElementById("pName").value.trim();
  var price = parseInt(document.getElementById("pPrice").value);
  var cat   = document.getElementById("pCat").value;
  var desc  = document.getElementById("pDesc").value.trim();
  var emoji = document.getElementById("pEmoji").value.trim();
  var msg   = document.getElementById("prodMsg");

  if (!name||!price||!cat||!desc||!emoji) {
    msg.textContent="❌ 모든 항목을 입력해주세요."; msg.className="msg err"; return;
  }

  waitFB(async function() {
    try {
      var fs = getFS(), db = getDB();
      await fs.addDoc(fs.collection(db,"products"),{
        name:name, price:price, cat:cat, desc:desc,
        emoji:emoji, imageUrl:"", createdAt:new Date().toISOString()
      });
      msg.textContent="✅ 상품이 등록되었습니다!"; msg.className="msg ok";
      ["pName","pPrice","pDesc","pEmoji"].forEach(function(id){document.getElementById(id).value="";});
      document.getElementById("pCat").value="";
      document.getElementById("previewBox").classList.remove("show");
      loadProducts(); loadStats();
      setTimeout(function(){msg.className="msg";},3000);
    } catch(e) {
      msg.textContent="❌ 오류: "+e.message; msg.className="msg err";
    }
  });
});

// ── 상품 목록 ─────────────────────────────────────────────────────────────────
function loadProducts() {
  waitFB(function() {
    getFS().onSnapshot(getFS().collection(getDB(),"products"), function(snap) {
      var el = document.getElementById("productTable");
      if (snap.empty) { el.innerHTML='<div class="no-data">등록된 상품이 없습니다.</div>'; return; }
      var html = '<table><tr><th>이미지</th><th>상품명</th><th>카테고리</th><th>가격</th><th>설명</th><th>삭제</th></tr>';
      snap.docs.forEach(function(d) {
        var p = d.data();
        var th = p.imageUrl ? '<img src="'+p.imageUrl+'" style="width:36px;height:36px;object-fit:cover;border-radius:6px;"/>' : '🛍️';
        html += '<tr>'
          + '<td><div class="prod-thumb">'+th+'</div></td>'
          + '<td><b>'+p.name+'</b></td>'
          + '<td><span style="background:#e8f4fd;color:#0f3460;padding:2px 7px;border-radius:10px;font-size:11px;">'+p.cat+'</span></td>'
          + '<td style="color:#e94560;font-weight:700;">₩'+p.price.toLocaleString()+'</td>'
          + '<td style="color:#888;">'+(p.desc||"").substring(0,28)+'...</td>'
          + '<td><button class="del-btn" data-id="'+d.id+'" data-url="'+(p.imageUrl||'')+'">🗑 삭제</button></td>'
          + '</tr>';
      });
      html += '</table>';
      el.innerHTML = html;
      el.querySelectorAll(".del-btn").forEach(function(btn) {
        btn.addEventListener("click", function() { delProduct(btn.dataset.id, btn.dataset.url); });
      });
    });
  });
}

function delProduct(id, imageUrl) {
  if (!confirm("정말 삭제하시겠습니까?")) return;
  waitFB(async function() {
    await getFS().deleteDoc(getFS().doc(getDB(),"products",id));
    if (imageUrl) {
      try { await window._stFn.deleteObject(window._stFn.ref(window._storage, imageUrl)); } catch(e) {}
    }
    loadProducts(); loadStats();
  });
}

// ── 주문 내역 ─────────────────────────────────────────────────────────────────
function loadOrders() {
  waitFB(function() {
    getFS().onSnapshot(getFS().collection(getDB(),"orders"), function(snap) {
      var el = document.getElementById("orderTable");
      if (snap.empty) { el.innerHTML='<div class="no-data">주문 내역이 없습니다.</div>'; return; }
      var html = '<table><tr><th>주문번호</th><th>이메일</th><th>상품</th><th>결제수단</th><th>금액</th><th>날짜</th></tr>';
      snap.docs.forEach(function(d) {
        var o = d.data();
        html += '<tr>'
          + '<td style="font-size:11px;color:#888;">'+o.orderNo+'</td>'
          + '<td>'+(o.email||o.uid)+'</td>'
          + '<td>'+o.items.map(function(i){return i.name;}).join(", ")+'</td>'
          + '<td>'+o.pay+'</td>'
          + '<td style="color:#e94560;font-weight:700;">₩'+o.total.toLocaleString()+'</td>'
          + '<td style="font-size:11px;color:#888;">'+o.date+'</td>'
          + '</tr>';
      });
      el.innerHTML = html + '</table>';
    });
  });
}

// ── 회원 목록 ─────────────────────────────────────────────────────────────────
function loadUsers() {
  waitFB(function() {
    getFS().onSnapshot(getFS().collection(getDB(),"users"), function(snap) {
      var el = document.getElementById("userTable");
      if (snap.empty) { el.innerHTML='<div class="no-data">회원이 없습니다.</div>'; return; }
      var html = '<table><tr><th>이메일</th><th>이름</th><th>권한</th><th>가입일</th><th>관리</th></tr>';
      snap.docs.forEach(function(d) {
        var u = d.data();
        var isAdmin = u.role === "admin";
        html += '<tr>'
          + '<td>'+u.email+'</td>'
          + '<td>'+u.name+'</td>'
          + '<td><span style="background:'+(isAdmin?"#fff8e1":"#f0f4ff")+';color:'+(isAdmin?"#f57f17":"#0f3460")+';padding:2px 7px;border-radius:10px;font-size:11px;">'+(isAdmin?"관리자":"일반회원")+'</span></td>'
          + '<td style="font-size:11px;color:#888;">'+(u.createdAt||"").substring(0,10)+'</td>'
          + '<td><button class="del-btn" data-id="'+d.id+'">🗑 삭제</button></td>'
          + '</tr>';
      });
      el.innerHTML = html + '</table>';
      el.querySelectorAll(".del-btn").forEach(function(btn) {
        btn.addEventListener("click", function() { delUser(btn.dataset.id); });
      });
    });
  });
}

function delUser(id) {
  if (!confirm("정말 삭제하시겠습니까?")) return;
  waitFB(async function() {
    await getFS().deleteDoc(getFS().doc(getDB(),"users",id));
    loadUsers(); loadStats();
  });
}

// ── 공지사항 ──────────────────────────────────────────────────────────────────
function loadNotices() {
  waitFB(async function() {
    var snap = await getFS().getDocs(getFS().collection(getDB(),"notices"));
    var el   = document.getElementById("noticeList");
    if (snap.empty) { el.innerHTML='<div class="no-data">공지가 없습니다.</div>'; return; }
    el.innerHTML = "";
    snap.docs.forEach(function(d) {
      var row = document.createElement("div");
      row.className = "notice-item";
      var span = document.createElement("span");
      span.textContent = "📢 " + d.data().text;
      var btn = document.createElement("button");
      btn.className = "del-btn";
      btn.textContent = "삭제";
      btn.addEventListener("click", function() { delNotice(d.id); });
      row.appendChild(span);
      row.appendChild(btn);
      el.appendChild(row);
    });
  });
}

document.getElementById("addNoticeBtn").addEventListener("click", function() {
  var t = document.getElementById("noticeInput").value.trim();
  if (!t) { alert("공지 내용을 입력해주세요."); return; }
  waitFB(async function() {
    await getFS().addDoc(getFS().collection(getDB(),"notices"),{text:t,createdAt:new Date().toISOString()});
    document.getElementById("noticeInput").value = "";
    loadNotices();
  });
});

document.getElementById("noticeInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("addNoticeBtn").click();
});

function delNotice(id) {
  waitFB(async function() {
    await getFS().deleteDoc(getFS().doc(getDB(),"notices",id));
    loadNotices();
  });
}
</script>
