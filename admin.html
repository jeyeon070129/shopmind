<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 - ShopMind</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:#f4f6fb;}
    nav{background:#0f3460;color:#fff;padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:62px;}
    .logo{font-size:22px;font-weight:800;cursor:pointer;}.logo span{color:#e94560;}
    .back-btn{background:transparent;border:1px solid #aaa;color:#aaa;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;}
    .wrap{max-width:1000px;margin:36px auto;padding:0 20px;}
    .tab-nav{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
    .tab-nav button{padding:10px 22px;border:2px solid #ddd;border-radius:25px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;}
    .tab-nav button.active{background:#0f3460;color:#fff;border-color:#0f3460;}
    .tab-content{display:none;}.tab-content.show{display:block;}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:8px;}
    .stat-card{background:#fff;border-radius:14px;padding:20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.07);}
    .stat-icon{font-size:32px;margin-bottom:8px;}
    .stat-val{font-size:24px;font-weight:800;color:#0f3460;}
    .stat-label{font-size:12px;color:#888;margin-top:4px;}
    .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin-bottom:24px;}
    .card h3{font-size:17px;font-weight:800;color:#0f3460;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #f0f0f0;}
    table{width:100%;border-collapse:collapse;}
    th{background:#f0f4ff;padding:11px 14px;text-align:left;font-size:13px;color:#555;font-weight:700;}
    td{padding:11px 14px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle;}
    .del-btn{background:#ffebee;color:#c62828;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;}
    .del-btn:hover{background:#c62828;color:#fff;}
    .prod-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .prod-form .full{grid-column:1/-1;}
    .prod-form input,.prod-form select,.prod-form textarea{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;}
    .prod-form input:focus,.prod-form select:focus{border-color:#0f3460;}
    .prod-form textarea{resize:none;height:72px;}
    .submit-btn{grid-column:1/-1;padding:13px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
    .preview-box{background:#f8f9fa;border-radius:12px;padding:16px;margin-bottom:16px;display:none;}
    .preview-box.show{display:flex;align-items:center;gap:16px;}
    .preview-emoji{font-size:48px;}
    .preview-info .name{font-size:16px;font-weight:700;color:#0f3460;}
    .preview-info .price{font-size:15px;color:#e94560;font-weight:700;}
    .preview-info .cat-tag{font-size:12px;background:#e8f4fd;color:#0f3460;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:4px;}
    .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
    .msg.ok{background:#e8f5e9;color:#2e7d32;display:block;}
    .msg.err{background:#ffebee;color:#c62828;display:block;}
    .notice-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee;}
    .no-data{text-align:center;padding:28px;color:#aaa;font-size:14px;}
    .badge.done{background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;}
  </style>
</head>
<body>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDSnirMbrHQNdqoN_pAEgpKoRDqKPUBdnU",
  authDomain: "shopmind-21828.firebaseapp.com",
  projectId: "shopmind-21828",
  storageBucket: "shopmind-21828.firebasestorage.app",
  messagingSenderId: "1038832915124",
  appId: "1:1038832915124:web:7f230b88de063b737b7de1"
};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window._db = db;
    window._fs = { doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, query, orderBy, onSnapshot };
    window._dbReady = true;
    document.dispatchEvent(new Event('dbReady'));
  </script>
<nav>
  <div class="logo" onclick="location.href='index.html'">Shop<span>Mind</span> <span style="font-size:13px;color:#f39c12;">관리자</span></div>
  <button class="back-btn" onclick="location.href='index.html'">← 스토어로</button>
</nav>
<div class="wrap">
  <div class="tab-nav">
    <button class="active" onclick="switchTab('dashboard')">📊 대시보드</button>
    <button onclick="switchTab('products')">📦 상품 관리</button>
    <button onclick="switchTab('orders')">🧾 주문 내역</button>
    <button onclick="switchTab('users')">👥 회원 관리</button>
    <button onclick="switchTab('notice')">📢 공지사항</button>
  </div>

  <!-- 대시보드 -->
  <div class="tab-content show" id="tab-dashboard">
    <div class="stats">
      <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val" id="statProds">-</div><div class="stat-label">등록 상품수</div></div>
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val" id="statUsers">-</div><div class="stat-label">총 회원수</div></div>
      <div class="stat-card"><div class="stat-icon">🧾</div><div class="stat-val" id="statOrders">-</div><div class="stat-label">총 주문수</div></div>
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val" id="statSales">-</div><div class="stat-label">총 매출(원)</div></div>
    </div>
  </div>

  <!-- 상품 관리 -->
  <div class="tab-content" id="tab-products">
    <div class="card">
      <h3>➕ 상품 추가</h3>
      <div id="prodMsg" class="msg"></div>
      <div class="preview-box" id="previewBox">
        <div class="preview-emoji" id="pvEmoji">🎁</div>
        <div class="preview-info">
          <div class="cat-tag" id="pvCat">카테고리</div>
          <div class="name" id="pvName">상품명</div>
          <div class="price" id="pvPrice">₩0</div>
        </div>
      </div>
      <div class="prod-form">
        <div><label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">상품명 *</label><input id="pName" placeholder="예: 무선 이어폰" oninput="updatePreview()"/></div>
        <div><label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">가격 (원) *</label><input id="pPrice" type="number" placeholder="예: 59000" oninput="updatePreview()"/></div>
        <div><label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">카테고리 *</label>
          <select id="pCat" onchange="updatePreview()"><option value="">선택</option><option>전자기기</option><option>패션</option><option>생활용품</option><option>식품</option></select>
        </div>
        <div><label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">이모지 *</label><input id="pEmoji" placeholder="예: 🎧" maxlength="4" oninput="updatePreview()"/></div>
        <div class="full"><label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">상품 설명 *</label><textarea id="pDesc" placeholder="상품 설명을 입력하세요."></textarea></div>
        <button class="submit-btn" onclick="addProduct()">✅ 상품 등록하기</button>
      </div>
    </div>
    <div class="card"><h3>📋 등록된 상품 목록</h3><div id="productTable"><div class="no-data">로딩 중...</div></div></div>
  </div>

  <!-- 주문 내역 -->
  <div class="tab-content" id="tab-orders">
    <div class="card"><h3>🧾 전체 주문 내역</h3><div id="orderTable"><div class="no-data">로딩 중...</div></div></div>
  </div>

  <!-- 회원 관리 -->
  <div class="tab-content" id="tab-users">
    <div class="card"><h3>👥 회원 목록</h3><div id="userTable"><div class="no-data">로딩 중...</div></div></div>
  </div>

  <!-- 공지사항 -->
  <div class="tab-content" id="tab-notice">
    <div class="card">
      <h3>📢 공지사항 관리</h3>
      <div id="noticeList"></div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <input id="noticeTitle" placeholder="공지 내용 입력" style="flex:1;padding:11px 14px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;outline:none;"/>
        <button onclick="addNotice()" style="padding:11px 20px;background:#0f3460;color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;">등록</button>
      </div>
    </div>
  </div>
</div>

<script>
  const uid=sessionStorage.getItem('sm_uid');
  if(uid!=='admin'){alert('관리자만 접근 가능합니다.');location.href='index.html';}

  function waitDB(fn){ if(window._dbReady) fn(); else document.addEventListener('dbReady',fn,{once:true}); }
  function switchTab(t){
    const ids=['dashboard','products','orders','users','notice'];
    document.querySelectorAll('.tab-nav button').forEach((b,i)=>b.classList.toggle('active',ids[i]===t));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('show'));
    document.getElementById('tab-'+t).classList.add('show');
    if(t==='dashboard')loadStats();
    if(t==='products')loadProducts();
    if(t==='orders')loadOrders();
    if(t==='users')loadUsers();
    if(t==='notice')loadNotices();
  }

  function updatePreview(){
    document.getElementById('pvEmoji').textContent=document.getElementById('pEmoji').value||'🎁';
    document.getElementById('pvName').textContent=document.getElementById('pName').value||'상품명';
    document.getElementById('pvPrice').textContent='₩'+(parseInt(document.getElementById('pPrice').value)||0).toLocaleString();
    document.getElementById('pvCat').textContent=document.getElementById('pCat').value||'카테고리';
    document.getElementById('previewBox').classList.add('show');
  }

  async function addProduct(){
    const name=document.getElementById('pName').value.trim();
    const price=parseInt(document.getElementById('pPrice').value);
    const cat=document.getElementById('pCat').value;
    const emoji=document.getElementById('pEmoji').value.trim();
    const desc=document.getElementById('pDesc').value.trim();
    const msg=document.getElementById('prodMsg');
    if(!name||!price||!cat||!emoji||!desc){msg.textContent='❌ 모든 항목을 입력해주세요.';msg.className='msg err';return;}
    waitDB(async()=>{
      const {collection,addDoc}=window._fs;
      await addDoc(collection(window._db,'products'),{name,price,cat,emoji,desc});
      msg.textContent='✅ 상품이 등록되었습니다!';msg.className='msg ok';
      ['pName','pPrice','pEmoji','pDesc'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('pCat').value='';
      document.getElementById('previewBox').classList.remove('show');
      loadProducts();
      setTimeout(()=>{msg.className='msg';},3000);
    });
  }

  function loadProducts(){
    waitDB(async()=>{
      const {collection,getDocs}=window._fs;
      const snap=await getDocs(collection(window._db,'products'));
      const el=document.getElementById('productTable');
      if(snap.empty){el.innerHTML='<div class="no-data">등록된 상품이 없습니다.</div>';return;}
      el.innerHTML=`<table><tr><th>아이콘</th><th>상품명</th><th>카테고리</th><th>가격</th><th>설명</th><th>삭제</th></tr>
      ${snap.docs.map(d=>{const p=d.data();return`<tr>
        <td style="font-size:26px;">${p.emoji}</td>
        <td><b>${p.name}</b></td>
        <td><span style="background:#e8f4fd;color:#0f3460;padding:2px 8px;border-radius:10px;font-size:12px;">${p.cat}</span></td>
        <td style="color:#e94560;font-weight:700;">₩${p.price.toLocaleString()}</td>
        <td style="color:#888;">${p.desc.substring(0,30)}...</td>
        <td><button class="del-btn" onclick="delProduct('${d.id}')">🗑 삭제</button></td>
      </tr>`;}).join('')}</table>`;
    });
  }

  async function delProduct(id){
    if(!confirm('정말 삭제하시겠습니까?'))return;
    waitDB(async()=>{
      const {doc,deleteDoc}=window._fs;
      await deleteDoc(doc(window._db,'products',id));
      loadProducts();loadStats();
    });
  }

  function loadOrders(){
    waitDB(async()=>{
      const {collection,getDocs}=window._fs;
      const snap=await getDocs(collection(window._db,'orders'));
      const el=document.getElementById('orderTable');
      if(snap.empty){el.innerHTML='<div class="no-data">주문 내역이 없습니다.</div>';return;}
      el.innerHTML=`<table><tr><th>주문번호</th><th>회원</th><th>상품</th><th>결제수단</th><th>금액</th><th>날짜</th></tr>
      ${snap.docs.map(d=>{const o=d.data();return`<tr>
        <td style="font-size:12px;color:#888;">${o.orderNo}</td>
        <td>${o.uid}</td>
        <td>${o.items.map(i=>i.name).join(', ')}</td>
        <td>${o.pay}</td>
        <td style="color:#e94560;font-weight:700;">₩${o.total.toLocaleString()}</td>
        <td style="font-size:12px;color:#888;">${o.date}</td>
      </tr>`;}).join('')}</table>`;
    });
  }

  function loadUsers(){
    waitDB(async()=>{
      const {collection,getDocs,doc,deleteDoc}=window._fs;
      const snap=await getDocs(collection(window._db,'users'));
      const el=document.getElementById('userTable');
      if(snap.empty){el.innerHTML='<div class="no-data">회원이 없습니다.</div>';return;}
      el.innerHTML=`<table><tr><th>아이디</th><th>이름</th><th>가입일</th><th>관리</th></tr>
      ${snap.docs.map(d=>{const u=d.data();return`<tr>
        <td>${d.id}</td><td>${u.name}</td>
        <td style="font-size:12px;color:#888;">${u.createdAt?u.createdAt.substring(0,10):'-'}</td>
        <td><button class="del-btn" onclick="delUser('${d.id}')">🗑 삭제</button></td>
      </tr>`;}).join('')}</table>`;
    });
  }

  async function delUser(id){
    if(!confirm(id+'님을 삭제하시겠습니까?'))return;
    waitDB(async()=>{
      const {doc,deleteDoc}=window._fs;
      await deleteDoc(doc(window._db,'users',id));
      loadUsers();loadStats();
    });
  }

  function loadStats(){
    waitDB(async()=>{
      const {collection,getDocs}=window._fs, db=window._db;
      const [ps,us,os]=await Promise.all([getDocs(collection(db,'products')),getDocs(collection(db,'users')),getDocs(collection(db,'orders'))]);
      document.getElementById('statProds').textContent=ps.size;
      document.getElementById('statUsers').textContent=us.size;
      document.getElementById('statOrders').textContent=os.size;
      const sales=os.docs.reduce((s,d)=>s+(d.data().total||0),0);
      document.getElementById('statSales').textContent=sales.toLocaleString();
    });
  }

  function loadNotices(){
    waitDB(async()=>{
      const {collection,getDocs,doc,deleteDoc}=window._fs;
      const snap=await getDocs(collection(window._db,'notices'));
      const el=document.getElementById('noticeList');
      if(snap.empty){el.innerHTML='<div class="no-data">공지가 없습니다.</div>';return;}
      el.innerHTML=snap.docs.map(d=>`
        <div class="notice-item">
          <span>📢 ${d.data().text}</span>
          <button class="del-btn" onclick="delNotice('${d.id}')">삭제</button>
        </div>`).join('');
    });
  }

  async function addNotice(){
    const t=document.getElementById('noticeTitle').value.trim();
    if(!t)return alert('공지 내용을 입력해주세요.');
    waitDB(async()=>{
      const {collection,addDoc}=window._fs;
      await addDoc(collection(window._db,'notices'),{text:t,createdAt:new Date().toISOString()});
      document.getElementById('noticeTitle').value='';
      loadNotices();
    });
  }

  async function delNotice(id){
    waitDB(async()=>{
      const {doc,deleteDoc}=window._fs;
      await deleteDoc(doc(window._db,'notices',id));
      loadNotices();
    });
  }

  loadStats();
</script>
</body>
</html>
