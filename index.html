<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopMind</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:#f4f6fb;}
    nav{background:#0f3460;color:#fff;padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
    .logo{font-size:22px;font-weight:800;}.logo span{color:#e94560;}
    .nav-links a{color:#ccc;text-decoration:none;margin-left:20px;font-size:14px;}
    .nav-links a:hover{color:#fff;}
    .nav-right{display:flex;align-items:center;gap:12px;}
    .cart-btn{background:#e94560;border:none;color:#fff;padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:700;font-size:14px;}
    .user-info{font-size:13px;color:#aaa;}
    .logout-btn{background:transparent;border:1px solid #aaa;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;}
    .logout-btn:hover{border-color:#fff;color:#fff;}
    .admin-btn{background:#f39c12;border:none;color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;}
    .search-bar{background:#fff;padding:18px 40px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;flex-wrap:wrap;}
    .search-bar input{flex:1;min-width:160px;padding:10px 16px;border:1.5px solid #ddd;border-radius:25px;font-size:14px;outline:none;}
    .search-bar input:focus{border-color:#0f3460;}
    .cat-btns{display:flex;gap:8px;flex-wrap:wrap;}
    .cat-btn{padding:7px 16px;border:1.5px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;}
    .cat-btn.active,.cat-btn:hover{background:#0f3460;color:#fff;border-color:#0f3460;}
    .hero{background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;padding:60px 40px;text-align:center;}
    .hero h2{font-size:38px;font-weight:800;margin-bottom:12px;}
    .hero p{font-size:16px;opacity:.85;margin-bottom:24px;}
    .hero-btn{background:#fff;color:#0f3460;padding:13px 32px;border-radius:30px;font-weight:700;font-size:15px;border:none;cursor:pointer;}
    .section{padding:40px;}
    .section-title{font-size:20px;font-weight:700;margin-bottom:20px;color:#0f3460;}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;}
    .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:.2s;}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.13);}
    .card-img{width:100%;height:170px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#f8f8f8;cursor:pointer;}
    .card-body{padding:14px;}
    .card-name{font-weight:700;font-size:14px;margin-bottom:4px;}
    .card-desc{font-size:12px;color:#888;margin-bottom:10px;}
    .card-cat{font-size:11px;background:#e8f4fd;color:#0f3460;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:8px;}
    .card-footer{display:flex;align-items:center;justify-content:space-between;}
    .price{font-size:15px;font-weight:800;color:#e94560;}
    .add-btn{background:#0f3460;color:#fff;border:none;padding:7px 13px;border-radius:8px;font-size:12px;cursor:pointer;}
    .add-btn:hover{background:#e94560;}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;}
    .overlay.show{display:block;}
    .cart-modal{position:fixed;right:-380px;top:0;bottom:0;width:380px;background:#fff;z-index:300;padding:28px;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.2);transition:right .3s;}
    .cart-modal.open{right:0;}
    .cart-modal h3{font-size:20px;font-weight:800;margin-bottom:20px;color:#0f3460;}
    .cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee;}
    .cart-item-emoji{font-size:30px;width:42px;text-align:center;}
    .cart-item-info{flex:1;}
    .cart-item-name{font-weight:600;font-size:14px;}
    .cart-item-price{font-size:13px;color:#e94560;font-weight:700;}
    .cart-item-qty{display:flex;align-items:center;gap:8px;margin-top:4px;}
    .qty-btn{width:24px;height:24px;border:1px solid #ddd;background:#f5f5f5;border-radius:5px;cursor:pointer;}
    .remove-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:18px;}
    .remove-btn:hover{color:#e94560;}
    .cart-total{margin-top:20px;padding-top:16px;border-top:2px solid #eee;font-size:18px;font-weight:800;color:#0f3460;text-align:right;}
    .checkout-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;}
    .empty-cart{text-align:center;padding:40px;color:#aaa;}
    .close-btn{position:absolute;top:20px;right:20px;background:none;border:none;font-size:24px;cursor:pointer;color:#888;}
    .detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center;}
    .detail-modal.show{display:flex;}
    .detail-box{background:#fff;border-radius:20px;padding:36px;width:480px;max-width:92vw;position:relative;}
    .detail-emoji{font-size:80px;text-align:center;margin-bottom:16px;}
    .detail-name{font-size:24px;font-weight:800;color:#0f3460;margin-bottom:8px;}
    .detail-price{font-size:22px;font-weight:800;color:#e94560;margin-bottom:12px;}
    .detail-desc{color:#555;line-height:1.7;margin-bottom:20px;}
    .detail-add{width:100%;padding:13px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;}
    footer{background:#0f3460;color:#aaa;text-align:center;padding:22px;font-size:13px;}
    .notice-bar{background:#fff8e1;border-left:4px solid #f39c12;padding:10px 40px;font-size:13px;color:#795548;}
    .loading-screen{text-align:center;padding:60px;color:#888;}
  </style>
</head>
<body>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDSnirMbrHQNdqoN_pAEgpKoRDqKPUBdnU",
      authDomain: "shopmind-21828.firebaseapp.com",
      projectId: "shopmind-21828",
      storageBucket: "shopmind-21828.firebasestorage.app",
      messagingSenderId: "1038832915124",
      appId: "1:1038832915124:web:7f230b88de063b737b7de1"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    window._auth = auth;
    window._db   = db;
    window._authFn = { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    window._fsFn  = { doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, onSnapshot };
    window._fbReady = true;
    document.dispatchEvent(new Event('fbReady'));
  </script>
<nav>
  <div class="logo">Shop<span>Mind</span></div>
  <div class="nav-links"><a href="#">홈</a><a href="#">신상품</a><a href="#">베스트</a><a href="#">세일</a></div>
  <div class="nav-right">
    <span class="user-info" id="userInfo"></span>
    <button class="admin-btn" id="adminBtn" onclick="location.href='admin.html'" style="display:none">⚙️ 관리자</button>
    <button class="cart-btn" onclick="openCart()">🛒 장바구니 <span id="cartCount">0</span></button>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</nav>
<div id="noticeBar" style="display:none" class="notice-bar"></div>
<div class="search-bar">
  <input id="searchInput" placeholder="🔍 상품 검색..." oninput="filterProducts()"/>
  <div class="cat-btns">
    <button class="cat-btn active" onclick="setcat('전체',this)">전체</button>
    <button class="cat-btn" onclick="setcat('전자기기',this)">전자기기</button>
    <button class="cat-btn" onclick="setcat('패션',this)">패션</button>
    <button class="cat-btn" onclick="setcat('생활용품',this)">생활용품</button>
    <button class="cat-btn" onclick="setcat('식품',this)">식품</button>
  </div>
</div>
<div class="hero">
  <h2>최고의 상품을<br/>최저가로! 🎉</h2>
  <p>지금 ShopMind에서 트렌디한 상품을 만나보세요</p>
  <button class="hero-btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">쇼핑 시작하기 →</button>
</div>
<div class="section" id="products">
  <div class="section-title">🔥 인기 상품</div>
  <div class="products" id="productGrid"><div class="loading-screen">⏳ 로딩 중...</div></div>
</div>
<footer>© 2025 ShopMind. All rights reserved.</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-modal" id="cartModal">
  <button class="close-btn" onclick="closeCart()">✕</button>
  <h3>🛒 장바구니</h3>
  <div id="cartItems"></div>
  <div id="cartTotal"></div>
</div>
<div class="detail-modal" id="detailModal">
  <div class="detail-box">
    <button class="close-btn" onclick="closeDetail()">✕</button>
    <div class="detail-emoji" id="dEmoji"></div>
    <div class="detail-name" id="dName"></div>
    <div class="detail-price" id="dPrice"></div>
    <div class="detail-desc" id="dDesc"></div>
    <button class="detail-add" id="dAddBtn">🛒 장바구니에 담기</button>
  </div>
</div>

<script>
  let currentUser=null, allProducts=[], curCat='전체', cart=[];

  function waitFB(fn){ if(window._fbReady) fn(); else document.addEventListener('fbReady',fn,{once:true}); }

  waitFB(()=>{
    window._authFn.onAuthStateChanged(window._auth, async user=>{
      if(!user){ location.href='login.html'; return; }
      currentUser=user;
      // 유저 정보
      const {doc,getDoc,collection,onSnapshot}=window._fsFn;
      const snap=await getDoc(doc(window._db,'users',user.uid));
      const data=snap.data()||{};
      document.getElementById('userInfo').textContent=(data.name||user.email)+'님 👋';
      if(data.role==='admin') document.getElementById('adminBtn').style.display='block';

      // 장바구니 복원
      cart=JSON.parse(sessionStorage.getItem('cart_'+user.uid)||'[]');
      updateCount();

      // 공지 실시간
      onSnapshot(collection(window._db,'notices'), snap=>{
        if(!snap.empty){
          document.getElementById('noticeBar').style.display='block';
          document.getElementById('noticeBar').textContent='📢 '+snap.docs[0].data().text;
        }
      });

      // 상품 실시간
      onSnapshot(collection(window._db,'products'), async snap=>{
        if(snap.empty){
          const defaults=[
            {name:'에어팟 프로',desc:'액티브 노이즈 캔슬링 프리미엄 무선 이어폰. 최대 30시간 배터리.',price:189000,emoji:'🎧',cat:'전자기기'},
            {name:'스마트워치 Pro',desc:'심박수, 혈중산소, GPS 탑재 올인원 스마트워치.',price:259000,emoji:'⌚',cat:'전자기기'},
            {name:'무선 블루투스 키보드',desc:'슬림 디자인 블루투스 키보드. 3대 멀티페어링.',price:79000,emoji:'⌨️',cat:'전자기기'},
            {name:'프리미엄 캐시미어 니트',desc:'부드럽고 따뜻한 100% 캐시미어 소재.',price:128000,emoji:'🧥',cat:'패션'},
            {name:'레더 크로스백',desc:'고급 인조가죽 미니 크로스백.',price:65000,emoji:'👜',cat:'패션'},
            {name:'공기청정기 미니',desc:'헤파필터 소형 공기청정기.',price:95000,emoji:'💨',cat:'생활용품'},
            {name:'유기농 그래놀라',desc:'설탕 무첨가 100% 유기농 그래놀라.',price:18000,emoji:'🥣',cat:'식품'},
            {name:'콜드브루 커피 세트',desc:'진하고 부드러운 콜드브루 10팩.',price:24000,emoji:'☕',cat:'식품'},
            {name:'LED 스탠드 조명',desc:'3단 밝기 조절 LED 스탠드.',price:45000,emoji:'💡',cat:'생활용품'},
            {name:'러닝화 에어쿠션',desc:'충격흡수 에어쿠션 밑창 러닝화.',price:89000,emoji:'👟',cat:'패션'},
          ];
          const {collection:col,addDoc}=window._fsFn;
          for(const p of defaults) await addDoc(col(window._db,'products'),p);
          return;
        }
        allProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
        filterProducts();
      });
    });
  });

  function setcat(c,el){curCat=c;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');filterProducts();}

  function filterProducts(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const f=allProducts.filter(p=>(curCat==='전체'||p.cat===curCat)&&(p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)));
    const grid=document.getElementById('productGrid');
    if(!f.length){grid.innerHTML='<div style="text-align:center;padding:40px;color:#aaa;">😢 상품이 없습니다.</div>';return;}
    grid.innerHTML=f.map(p=>`
      <div class="card">
        <div class="card-img" onclick="openDetail('${p.id}')">${p.emoji}</div>
        <div class="card-body">
          <span class="card-cat">${p.cat}</span>
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.desc.substring(0,30)}...</div>
          <div class="card-footer">
            <span class="price">₩${p.price.toLocaleString()}</span>
            <button class="add-btn" onclick="addCart('${p.id}',this)">담기</button>
          </div>
        </div>
      </div>`).join('');
  }

  function saveCart(){ if(currentUser) sessionStorage.setItem('cart_'+currentUser.uid, JSON.stringify(cart)); }
  function updateCount(){ document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.qty,0); }
  function addCart(id,btn){
    const p=allProducts.find(x=>x.id===id);
    const ex=cart.find(x=>x.id===id);
    if(ex)ex.qty++; else cart.push({...p,qty:1});
    saveCart(); updateCount();
    if(btn){btn.textContent='✓';btn.style.background='#2e7d32';setTimeout(()=>{btn.textContent='담기';btn.style.background='';},900);}
  }
  function removeCart(id){cart=cart.filter(x=>x.id!==id);saveCart();updateCount();renderCart();}
  function changeQty(id,d){const ex=cart.find(x=>x.id===id);if(ex){ex.qty+=d;if(ex.qty<1)removeCart(id);}saveCart();updateCount();renderCart();}

  function renderCart(){
    const el=document.getElementById('cartItems'),tot=document.getElementById('cartTotal');
    if(!cart.length){el.innerHTML='<div class="empty-cart">🛒<br/>장바구니가 비어있어요</div>';tot.innerHTML='';return;}
    el.innerHTML=cart.map(i=>`
      <div class="cart-item">
        <div class="cart-item-emoji">${i.emoji}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-price">₩${(i.price*i.qty).toLocaleString()}</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button>
            <span>${i.qty}</span>
            <button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeCart('${i.id}')">✕</button>
      </div>`).join('');
    const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
    tot.innerHTML=`<div class="cart-total">합계: ₩${total.toLocaleString()}</div>
      <button class="checkout-btn" onclick="goCheckout()">결제하기 →</button>`;
  }

  function goCheckout(){if(!cart.length)return alert('장바구니가 비어있습니다.');closeCart();location.href='checkout.html';}
  function openCart(){document.getElementById('cartModal').classList.add('open');document.getElementById('overlay').classList.add('show');renderCart();}
  function closeCart(){document.getElementById('cartModal').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  function openDetail(id){
    const p=allProducts.find(x=>x.id===id);
    document.getElementById('dEmoji').textContent=p.emoji;
    document.getElementById('dName').textContent=p.name;
    document.getElementById('dPrice').textContent='₩'+p.price.toLocaleString();
    document.getElementById('dDesc').textContent=p.desc;
    document.getElementById('dAddBtn').onclick=()=>{addCart(id,null);closeDetail();openCart();};
    document.getElementById('detailModal').classList.add('show');
  }
  function closeDetail(){document.getElementById('detailModal').classList.remove('show');}
  async function logout(){
    await window._authFn.signOut(window._auth);
    sessionStorage.clear();
    location.href='login.html';
  }
</script>
</body>
</html>
