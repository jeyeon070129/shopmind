<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopMind</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:#f4f6fb;}
    
    nav{background:#0f3460;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
    .logo{font-size:22px;font-weight:800;flex-shrink:0;}.logo span{color:#e94560;}
    .nav-links{display:flex;gap:16px;}
    .nav-links a{color:#ccc;text-decoration:none;font-size:14px;}
    .nav-links a:hover{color:#fff;}
    .nav-right{display:flex;align-items:center;gap:8px;}
    .user-info{font-size:13px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
    .cart-btn{background:#e94560;border:none;color:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;}
    .logout-btn{background:transparent;border:1px solid #aaa;color:#aaa;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;white-space:nowrap;}
    .logout-btn:hover{border-color:#fff;color:#fff;}
    .admin-btn{background:#f39c12;border:none;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;}
    @media(max-width:768px){.nav-links{display:none;}.user-info{max-width:80px;font-size:11px;}.cart-btn{padding:6px 10px;font-size:12px;}.logout-btn{padding:5px 8px;font-size:11px;}.admin-btn{padding:5px 8px;font-size:11px;}}
    @media(max-width:480px){nav{padding:0 12px;}.user-info{display:none;}}

    .search-bar{background:#fff;padding:14px 24px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;flex-wrap:wrap;}
    .search-bar input{flex:1;min-width:140px;padding:9px 16px;border:1.5px solid #ddd;border-radius:25px;font-size:14px;outline:none;}
    .search-bar input:focus{border-color:#0f3460;}
    .cat-btns{display:flex;gap:6px;flex-wrap:wrap;}
    .cat-btn{padding:6px 14px;border:1.5px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;}
    .cat-btn.active,.cat-btn:hover{background:#0f3460;color:#fff;border-color:#0f3460;}
    .hero{background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;padding:50px 24px;text-align:center;}
    .hero h2{font-size:32px;font-weight:800;margin-bottom:10px;}
    .hero p{font-size:15px;opacity:.85;margin-bottom:20px;}
    .hero-btn{background:#fff;color:#0f3460;padding:12px 28px;border-radius:30px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
    @media(max-width:480px){.hero h2{font-size:24px;}.hero p{font-size:13px;}}
    .section{padding:30px 24px;}
    .section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#0f3460;}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
    @media(min-width:600px){.products{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}}
    .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:.2s;}
    .card:hover{transform:translateY(-3px);}
    .card-img{width:100%;height:150px;object-fit:cover;background:#f8f8f8;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;}
    .card-img img{width:100%;height:100%;object-fit:cover;}
    .card-body{padding:12px;}
    .card-name{font-weight:700;font-size:13px;margin-bottom:3px;}
    .card-desc{font-size:11px;color:#888;margin-bottom:8px;}
    .card-cat{font-size:10px;background:#e8f4fd;color:#0f3460;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:6px;}
    .card-footer{display:flex;align-items:center;justify-content:space-between;}
    .price{font-size:14px;font-weight:800;color:#e94560;}
    .add-btn{background:#0f3460;color:#fff;border:none;padding:6px 11px;border-radius:7px;font-size:11px;cursor:pointer;}
    .add-btn:hover{background:#e94560;}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;}
    .overlay.show{display:block;}
    .cart-modal{position:fixed;right:-100%;top:0;bottom:0;width:min(380px,100vw);background:#fff;z-index:300;padding:24px;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.2);transition:right .3s;}
    .cart-modal.open{right:0;}
    .cart-modal h3{font-size:18px;font-weight:800;margin-bottom:18px;color:#0f3460;}
    .cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee;}
    .cart-item-img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#f8f8f8;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;}
    .cart-item-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
    .cart-item-info{flex:1;min-width:0;}
    .cart-item-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cart-item-price{font-size:12px;color:#e94560;font-weight:700;}
    .cart-item-qty{display:flex;align-items:center;gap:6px;margin-top:3px;}
    .qty-btn{width:22px;height:22px;border:1px solid #ddd;background:#f5f5f5;border-radius:4px;cursor:pointer;}
    .remove-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;flex-shrink:0;}
    .remove-btn:hover{color:#e94560;}
    .cart-total{margin-top:16px;padding-top:14px;border-top:2px solid #eee;font-size:17px;font-weight:800;color:#0f3460;text-align:right;}
    .checkout-btn{width:100%;padding:13px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;}
    .empty-cart{text-align:center;padding:40px;color:#aaa;}
    .close-btn{position:absolute;top:18px;right:18px;background:none;border:none;font-size:22px;cursor:pointer;color:#888;}
    .detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center;padding:16px;}
    .detail-modal.show{display:flex;}
    .detail-box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:460px;position:relative;max-height:90vh;overflow-y:auto;}
    .detail-img{width:100%;height:200px;border-radius:12px;margin-bottom:14px;background:#f8f8f8;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden;}
    .detail-img img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
    .detail-name{font-size:22px;font-weight:800;color:#0f3460;margin-bottom:6px;}
    .detail-price{font-size:20px;font-weight:800;color:#e94560;margin-bottom:10px;}
    .detail-desc{color:#555;line-height:1.7;margin-bottom:18px;font-size:14px;}
    .detail-add{width:100%;padding:12px;background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
    footer{background:#0f3460;color:#aaa;text-align:center;padding:20px;font-size:13px;}
    .notice-bar{background:#fff8e1;border-left:4px solid #f39c12;padding:10px 24px;font-size:13px;color:#795548;}
    .loading-screen{text-align:center;padding:60px;color:#888;}
  </style>
</head>
<body>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
    const app  = initializeApp({
      apiKey:"AIzaSyDSnirMbrHQNdqoN_pAEgpKoRDqKPUBdnU",
      authDomain:"shopmind-21828.firebaseapp.com",
      projectId:"shopmind-21828",
      storageBucket:"shopmind-21828.firebasestorage.app",
      messagingSenderId:"1038832915124",
      appId:"1:1038832915124:web:7f230b88de063b737b7de1"
    });
    window._auth    = getAuth(app);
    window._db      = getFirestore(app);
    window._storage = getStorage(app);
    window._authFn  = { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    window._fsFn    = { doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc, onSnapshot };
    window._stFn    = { ref, uploadBytes, getDownloadURL, deleteObject };
    window._fbReady = true;
    document.dispatchEvent(new Event('fbReady'));
  </script>
<nav>
  <div class="logo">Shop<span>Mind</span></div>
  <div class="nav-links"><a href="#">홈</a><a href="#">신상품</a><a href="#">베스트</a></div>
  <div class="nav-right">
    <span class="user-info" id="userInfo"></span>
    <button class="admin-btn" id="adminBtn" onclick="location.href='admin.html'" style="display:none">관리자</button>
    <button class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
</nav>
<div id="noticeBar" style="display:none" class="notice-bar"></div>
<div class="search-bar">
  <input id="searchInput" placeholder="🔍 상품 검색..." oninput="filterProducts()"/>
  <div class="cat-btns" id="catBtns"></div>
</div>
<div class="hero">
  <h2>최고의 상품을<br/>최저가로! 🎉</h2>
  <p>지금 ShopMind에서 트렌디한 상품을 만나보세요</p>
  <button class="hero-btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">쇼핑 시작하기 →</button>
</div>
<div class="section" id="products">
  <div class="section-title">🔥 인기 상품</div>
  <div class="products" id="productGrid"><div class="loading-screen">⏳ 로딩 중...</div></div>
</div>
<footer>© 2025 ShopMind. All rights reserved.</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-modal" id="cartModal">
  <button class="close-btn" onclick="closeCart()">✕</button>
  <h3>🛒 장바구니</h3>
  <div id="cartItems"></div>
  <div id="cartTotal"></div>
</div>
<div class="detail-modal" id="detailModal">
  <div class="detail-box">
    <button class="close-btn" onclick="closeDetail()">✕</button>
    <div class="detail-img" id="dImg"></div>
    <div class="detail-name" id="dName"></div>
    <div class="detail-price" id="dPrice"></div>
    <div class="detail-desc" id="dDesc"></div>
    <button class="detail-add" id="dAddBtn">🛒 장바구니에 담기</button>
  </div>
</div>

<script>
  var currentUser = null;
  var allProducts = [];
  var allCats = [];
  var curCat = "전체";
  var cart = [];

  function waitFB(fn) {
    if (window._fbReady) fn();
    else document.addEventListener('fbReady', fn, {once:true});
  }

  waitFB(function() {
    window._authFn.onAuthStateChanged(window._auth, async function(user) {
      if (!user) { location.href = 'login.html'; return; }
      currentUser = user;

      var fsFn = window._fsFn;
      var db = window._db;

      var snap = await fsFn.getDoc(fsFn.doc(db, 'users', user.uid));
      var data = snap.data() || {};
      document.getElementById('userInfo').textContent = (data.name || user.email.split('@')[0]) + '님';
      if (data.role === 'admin') document.getElementById('adminBtn').style.display = 'block';

      cart = JSON.parse(sessionStorage.getItem('cart_' + user.uid) || '[]');
      updateCount();

      // 공지
      fsFn.onSnapshot(fsFn.collection(db, 'notices'), function(s) {
        if (!s.empty) {
          document.getElementById('noticeBar').style.display = 'block';
          document.getElementById('noticeBar').textContent = '📢 ' + s.docs[0].data().text;
        }
      });

      // 카테고리
      fsFn.onSnapshot(fsFn.collection(db, 'categories'), function(s) {
        allCats = s.docs.map(function(d) { return {id: d.id, name: d.data().name}; });
        renderCatBtns();
      });

      // 상품
      fsFn.onSnapshot(fsFn.collection(db, 'products'), async function(s) {
        if (s.empty) {
          var defaults = [
            {name:'에어팟 프로', desc:'노이즈캔슬링 무선이어폰.', price:189000, imageUrl:'', emoji:'🎧', cat:'전자기기'},
            {name:'스마트워치 Pro', desc:'GPS 올인원 스마트워치.', price:259000, imageUrl:'', emoji:'⌚', cat:'전자기기'},
            {name:'캐시미어 니트', desc:'100% 캐시미어 소재.', price:128000, imageUrl:'', emoji:'🧥', cat:'패션'},
            {name:'레더 크로스백', desc:'고급 인조가죽 크로스백.', price:65000, imageUrl:'', emoji:'👜', cat:'패션'},
            {name:'공기청정기 미니', desc:'헤파필터 소형.', price:95000, imageUrl:'', emoji:'💨', cat:'생활용품'},
            {name:'유기농 그래놀라', desc:'설탕 무첨가.', price:18000, imageUrl:'', emoji:'🥣', cat:'식품'},
          ];
          for (var p of defaults) await fsFn.addDoc(fsFn.collection(db, 'products'), p);
          return;
        }
        allProducts = s.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
        filterProducts();
      });
    });
  });

  function renderCatBtns() {
    var wrap = document.getElementById('catBtns');
    wrap.innerHTML = '';

    var allBtn = document.createElement('button');
    allBtn.className = 'cat-btn' + (curCat === '전체' ? ' active' : '');
    allBtn.textContent = '전체';
    allBtn.addEventListener('click', function() { setcat('전체', this); });
    wrap.appendChild(allBtn);

    allCats.forEach(function(c) {
      var btn = document.createElement('button');
      btn.className = 'cat-btn' + (curCat === c.name ? ' active' : '');
      btn.textContent = c.name;
      btn.addEventListener('click', function() { setcat(c.name, this); });
      wrap.appendChild(btn);
    });
  }

  function setcat(c, el) {
    curCat = c;
    document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
    filterProducts();
  }

  function filterProducts() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var f = allProducts.filter(function(p) {
      return (curCat === '전체' || p.cat === curCat) &&
             (p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));
    });
    var grid = document.getElementById('productGrid');
    if (!f.length) { grid.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">😢 상품이 없습니다.</div>'; return; }
    grid.innerHTML = f.map(function(p) {
      var imgHtml = p.imageUrl
        ? '<img src="' + p.imageUrl + '" alt="' + p.name + '"/>'
        : '<span>' + (p.emoji || '🛍️') + '</span>';
      return '<div class="card">' +
        '<div class="card-img" onclick="openDetail('' + p.id + '')">' + imgHtml + '</div>' +
        '<div class="card-body">' +
          '<span class="card-cat">' + p.cat + '</span>' +
          '<div class="card-name">' + p.name + '</div>' +
          '<div class="card-desc">' + (p.desc||'').substring(0,28) + '...</div>' +
          '<div class="card-footer">' +
            '<span class="price">₩' + p.price.toLocaleString() + '</span>' +
            '<button class="add-btn" onclick="addCart('' + p.id + '',this)">담기</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function saveCart() { if (currentUser) sessionStorage.setItem('cart_' + currentUser.uid, JSON.stringify(cart)); }
  function updateCount() { document.getElementById('cartCount').textContent = cart.reduce(function(s,i){return s+i.qty;}, 0); }

  function addCart(id, btn) {
    var p = allProducts.find(function(x){return x.id===id;});
    var ex = cart.find(function(x){return x.id===id;});
    if (ex) ex.qty++; else cart.push(Object.assign({}, p, {qty:1}));
    saveCart(); updateCount();
    if (btn) { btn.textContent='✓'; btn.style.background='#2e7d32'; setTimeout(function(){btn.textContent='담기';btn.style.background='';}, 900); }
  }

  function removeCart(id) { cart = cart.filter(function(x){return x.id!==id;}); saveCart(); updateCount(); renderCart(); }
  function changeQty(id, d) {
    var ex = cart.find(function(x){return x.id===id;});
    if (ex) { ex.qty += d; if (ex.qty < 1) { removeCart(id); return; } }
    saveCart(); updateCount(); renderCart();
  }

  function renderCart() {
    var el = document.getElementById('cartItems');
    var tot = document.getElementById('cartTotal');
    if (!cart.length) { el.innerHTML = '<div class="empty-cart">🛒<br/>장바구니가 비어있어요</div>'; tot.innerHTML = ''; return; }
    el.innerHTML = cart.map(function(i) {
      var imgHtml = i.imageUrl ? '<img src="' + i.imageUrl + '"/>' : (i.emoji || '🛍️');
      return '<div class="cart-item">' +
        '<div class="cart-item-img">' + imgHtml + '</div>' +
        '<div class="cart-item-info">' +
          '<div class="cart-item-name">' + i.name + '</div>' +
          '<div class="cart-item-price">₩' + (i.price*i.qty).toLocaleString() + '</div>' +
          '<div class="cart-item-qty">' +
            '<button class="qty-btn" onclick="changeQty('' + i.id + '',-1)">−</button>' +
            '<span>' + i.qty + '</span>' +
            '<button class="qty-btn" onclick="changeQty('' + i.id + '',1)">+</button>' +
          '</div>' +
        '</div>' +
        '<button class="remove-btn" onclick="removeCart('' + i.id + '')">✕</button>' +
      '</div>';
    }).join('');
    var total = cart.reduce(function(s,i){return s+i.price*i.qty;}, 0);
    tot.innerHTML = '<div class="cart-total">합계: ₩' + total.toLocaleString() + '</div>' +
      '<button class="checkout-btn" onclick="goCheckout()">결제하기 →</button>';
  }

  function goCheckout() { if (!cart.length) { alert('장바구니가 비어있습니다.'); return; } closeCart(); location.href = 'checkout.html'; }
  function openCart() { document.getElementById('cartModal').classList.add('open'); document.getElementById('overlay').classList.add('show'); renderCart(); }
  function closeCart() { document.getElementById('cartModal').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

  function openDetail(id) {
    var p = allProducts.find(function(x){return x.id===id;});
    var imgEl = document.getElementById('dImg');
    imgEl.innerHTML = p.imageUrl ? '<img src="' + p.imageUrl + '" alt="' + p.name + '"/>' : '<span>' + (p.emoji||'🛍️') + '</span>';
    document.getElementById('dName').textContent = p.name;
    document.getElementById('dPrice').textContent = '₩' + p.price.toLocaleString();
    document.getElementById('dDesc').textContent = p.desc;
    document.getElementById('dAddBtn').onclick = function() { addCart(id, null); closeDetail(); openCart(); };
    document.getElementById('detailModal').classList.add('show');
  }
  function closeDetail() { document.getElementById('detailModal').classList.remove('show'); }

  function doLogout() {
    window._authFn.signOut(window._auth).then(function() {
      sessionStorage.clear();
      location.href = 'login.html';
    });
  }
</script>
</body></html>
